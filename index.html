                      <div key={i} className="p-3 bg-slate-900 rounded-xl border border-slate-800 text-xs">
                        <div className="flex justify-between text-amber-400 font-bold mb-1">
                          <span>Over {c.over}</span>
                          <span className="text-emerald-400">{c.tag}</span>
                        </div>
                        <p className="text-slate-300">{c.text}</p>
                      </div>
                    ))
                  ) : (
                    <p className="text-xs text-slate-500">Live commentary stream active.</p>
                  )}
                </div>

                <button onClick={() => setSelectedMatch(null)} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs">
                  Close Scorecard
                </button>
              </div>
            </div>
          )}

          {/* Player Modal */}
          {selectedPlayer && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#0C1424] border border-slate-700 rounded-3xl max-w-2xl w-full p-6 space-y-4">
                <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                  <div className="flex items-center space-x-3">
                    <img src={selectedPlayer.avatar} className="w-16 h-16 rounded-2xl object-cover border border-emerald-500/40" />
                    <div>
                      <span className="text-xs text-emerald-400 font-bold">{selectedPlayer.flag} {selectedPlayer.country} • {selectedPlayer.role}</span>
                      <h3 className="text-2xl font-black text-white">{selectedPlayer.name}</h3>
                      <span className="text-xs text-amber-300 font-semibold">{selectedPlayer.iccRankings}</span>
                    </div>
                  </div>
                  <button onClick={() => setSelectedPlayer(null)} className="p-2 bg-slate-800 rounded-xl text-slate-400 hover:text-white">✕</button>
                </div>
                <p className="text-xs text-slate-300 bg-slate-900/60 p-3 rounded-xl border border-slate-800 leading-relaxed">{selectedPlayer.bio}</p>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                  <div className="p-2 bg-slate-900 rounded-xl"><span className="text-slate-400 block text-[10px]">Matches</span><strong className="text-white text-base">{selectedPlayer.stats.matches}</strong></div>
                  <div className="p-2 bg-slate-900 rounded-xl"><span className="text-slate-400 block text-[10px]">Runs/Wkts</span><strong className="text-amber-400 text-base">{selectedPlayer.stats.runs || selectedPlayer.stats.wickets}</strong></div>
                  <div className="p-2 bg-slate-900 rounded-xl"><span className="text-slate-400 block text-[10px]">Average</span><strong className="text-emerald-400 text-base">{selectedPlayer.stats.avg}</strong></div>
                  <div className="p-2 bg-slate-900 rounded-xl"><span className="text-slate-400 block text-[10px]">SR/Econ</span><strong className="text-cyan-400 text-base">{selectedPlayer.stats.sr || selectedPlayer.stats.econ}</strong></div>
                </div>
                <button onClick={() => setSelectedPlayer(null)} className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold rounded-xl text-xs">
                  Done
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-12 bg-[#060A14] border-t border-slate-800 py-6 text-center text-xs text-slate-500">
            <p className="text-slate-400 font-semibold">Cricket Pulse AI © 2026 • Professional Live Scoreboard & Player Analytics</p>
            <p className="mt-1">Deploy ready on Vercel, Supabase, and Netlify.</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
